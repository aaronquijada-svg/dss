spring:
  application:
    name: sfe-sign
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SFE_SIGN_SERVER_PORT:18080}

sfe-sign:
  signing-provider: ${SFE_SIGN_SIGNING_PROVIDER:mock}
  pkcs11-library-path: ${SFE_SIGN_PKCS11_LIBRARY_PATH:}
  tsa-url: ${SFE_SIGN_TSA_URL:}
  pkcs11-slot: ${SFE_SIGN_PKCS11_SLOT:0}
  agent-url: ${SFE_SIGN_AGENT_URL:}
  agent-session-secret: ${SFE_SIGN_AGENT_SESSION_SECRET:}
